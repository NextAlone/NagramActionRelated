# Posts the files of a directory to a Telegram channel, by default as one
# rich message that holds the title, the notes or the commits, the files
# and the buttons. Shared by the Nagram applications, which give it their
# data and get the same layout:
#   uses: NextAlone/NagramActionRelated/channel-publish@<commit>
#
# The files are too large for the public Bot API (50 MB), so the step
# runs a Bot API server of its own for the duration of the call. The
# server is the binary bot-api-binary.yml builds from a pinned
# tdlib/telegram-bot-api commit and attaches to a release of this
# repository; it is taken by the checksum recorded below, because it is
# handed the bot token and the files. Needs an ubuntu-24.04 runner, the
# system the binary is built on; a macOS or Windows build hands its files
# over as an artifact to a job that runs this.

name: Publish to a Telegram channel.
description: Post the files of a directory to a Telegram channel through a local Bot API server.

inputs:
  bot-token:
    description: Token of a bot that may post in the channel.
    required: true
  api-id:
    description: Telegram API id the Bot API server runs with.
    required: true
  api-hash:
    description: Telegram API hash the Bot API server runs with.
    required: true
  chat-id:
    description: The channel, its id or @username.
    required: true
  copy-to:
    description: Other channels that get the post as well, separated by spaces or lines; the files are not sent again.
  directory:
    description: Directory whose files are posted.
    required: true
  style:
    description: "'rich' for one rich message, 'album' for documents with a short caption under the last."
    default: rich
  kind:
    description: "'release', or 'test' for a build of a push: a smaller title, sent without a notification."
    default: release
  title:
    description: Name of the application.
  version:
    description: Version shown after the title.
  build:
    description: Shown in brackets after the version, such as a commit or a build number.
  hashtags:
    description: Hashtags without '#', separated by spaces.
  notes-file:
    description: Markdown notes of the release.
  notes-en-file:
    description: English notes, folded under the others.
  fold-sections:
    description: Headings of the '## ' sections of the notes to fold, one per line.
  drop-sections:
    description: Headings of the '## ' sections of the notes to leave out, one per line.
  commits-file:
    description: 'JSON list of commits, [{"id", "message"}] as in a push event; shown grouped by their kind.'
  repository:
    description: Address of the repository the commits link to.
    default: ${{ github.server_url }}/${{ github.repository }}
  body-file:
    description: Plain text under the title.
  files-title:
    description: Heading above the files.
  folded-files-title:
    description: Summary of the folded files.
  files:
    description: "Order and captions of the files, one 'PATTERN | CAPTION | folded' per line; caption and 'folded' are optional. Files no line matches come last."
  buttons:
    description: "Rows of buttons, one row per line: 'TEXT=ADDRESS | TEXT=ADDRESS'. '*' before a text marks the main button; the address {post} is the first post of the files, and such a button is left out of that post."
  caption-file:
    description: A ready HTML caption of an album, used instead of the parts above.

outputs:
  messages:
    description: 'The posted messages as JSON, [{"file": <name>, "message_id": <id>}].'
    value: ${{ steps.publish.outputs.messages }}

runs:
  using: composite
  steps:
    - name: Publish.
      id: publish
      shell: bash
      env:
        # The release of this repository that holds the server and the
        # SHA-256 of the binary; bot-api-binary.yml prints both.
        BOT_API_RELEASE: telegram-bot-api-2efabc722e9493b9cac450233198d09e5cea0573
        BOT_API_SHA256: 54c2b3772b15d98f04042603b63c7b0a3fecf113394a58cda5b9a995e5dfb5a6
        CHANNEL_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_API_ID: ${{ inputs.api-id }}
        TELEGRAM_API_HASH: ${{ inputs.api-hash }}
        CHAT_ID: ${{ inputs.chat-id }}
        COPY_TO: ${{ inputs.copy-to }}
        DIRECTORY: ${{ inputs.directory }}
        STYLE: ${{ inputs.style }}
        KIND: ${{ inputs.kind }}
        TITLE: ${{ inputs.title }}
        VERSION: ${{ inputs.version }}
        BUILD: ${{ inputs.build }}
        HASHTAGS: ${{ inputs.hashtags }}
        NOTES_FILE: ${{ inputs.notes-file }}
        NOTES_EN_FILE: ${{ inputs.notes-en-file }}
        FOLD_SECTIONS: ${{ inputs.fold-sections }}
        DROP_SECTIONS: ${{ inputs.drop-sections }}
        COMMITS_FILE: ${{ inputs.commits-file }}
        REPOSITORY: ${{ inputs.repository }}
        BODY_FILE: ${{ inputs.body-file }}
        FILES_TITLE: ${{ inputs.files-title }}
        FOLDED_FILES_TITLE: ${{ inputs.folded-files-title }}
        FILES: ${{ inputs.files }}
        BUTTONS: ${{ inputs.buttons }}
        CAPTION_FILE: ${{ inputs.caption-file }}
      run: |
        set -euo pipefail
        if [ -z "$BOT_API_RELEASE" ] || [ -z "$BOT_API_SHA256" ]; then
          echo "::error::This commit of the action records no Bot API server binary."
          exit 1
        fi

        files=()
        while IFS= read -r -d '' file; do
          files+=("$file")
        done < <(find "$(realpath "$DIRECTORY")" -maxdepth 1 -type f -print0 | sort -z)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::$DIRECTORY has no files to post."
          exit 1
        fi

        arguments=(--chat-id "$CHAT_ID" --out "$RUNNER_TEMP/channel-messages.json")
        arguments+=(--style "$STYLE" --kind "$KIND" --repository "$REPOSITORY")
        for chat in $COPY_TO; do
          arguments+=(--copy-to "$chat")
        done
        for tag in $HASHTAGS; do
          arguments+=(--hashtag "$tag")
        done
        # An option that takes one value, given when the value is set.
        single() {
          if [ -n "$2" ]; then
            arguments+=("$1" "$2")
          fi
        }
        single --title "$TITLE"
        single --version "$VERSION"
        single --build "$BUILD"
        single --notes-file "$NOTES_FILE"
        single --notes-en-file "$NOTES_EN_FILE"
        single --commits-file "$COMMITS_FILE"
        single --body-file "$BODY_FILE"
        single --files-title "$FILES_TITLE"
        single --folded-files-title "$FOLDED_FILES_TITLE"
        single --caption-file "$CAPTION_FILE"
        # An option given once for every line of the value that is not empty.
        lines() {
          local line
          while IFS= read -r line; do
            if [ -n "${line//[[:space:]]/}" ]; then
              arguments+=("$1" "$line")
            fi
          done <<< "$2"
        }
        lines --fold-section "$FOLD_SECTIONS"
        lines --drop-section "$DROP_SECTIONS"
        lines --file-rule "$FILES"
        lines --button-row "$BUTTONS"

        work="$(mktemp -d "$RUNNER_TEMP/bot-api.XXXXXX")"
        server=""
        finish() {
          status=$?
          if [ -n "$server" ]; then
            kill "$server" 2> /dev/null || true
            wait "$server" 2> /dev/null || true
          fi
          if [ "$status" -ne 0 ] && [ -f "$work/log" ]; then
            tail -n 50 "$work/log"
          fi
          # The working directory of the server holds the session of the bot.
          rm -rf "$work"
        }
        trap finish EXIT

        curl --fail --silent --show-error --location --retry 3 \
          --output "$work/telegram-bot-api" \
          "https://github.com/NextAlone/NagramActionRelated/releases/download/$BOT_API_RELEASE/telegram-bot-api-linux-x86_64"
        echo "$BOT_API_SHA256  $work/telegram-bot-api" | sha256sum --check --quiet
        chmod +x "$work/telegram-bot-api"

        port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
        mkdir "$work/data" "$work/temp"
        # The server reads the API id and hash from the environment.
        "$work/telegram-bot-api" --local \
          --http-ip-address=127.0.0.1 --http-port="$port" \
          --dir="$work/data" --temp-dir="$work/temp" --log="$work/log" &
        server=$!

        python3 "$GITHUB_ACTION_PATH/channel_publish.py" \
          --api "http://127.0.0.1:$port" "${arguments[@]}" "${files[@]}"
        echo "messages=$(cat "$RUNNER_TEMP/channel-messages.json")" >> "$GITHUB_OUTPUT"
