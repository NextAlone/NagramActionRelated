# Posts the files of a directory to a Telegram channel as documents, with
# one caption under the last of them. Shared by the Nagram applications:
#   uses: NextAlone/NagramActionRelated/channel-publish@<commit>
#
# The files are too large for the public Bot API (50 MB), so the step
# runs a Bot API server of its own for the duration of the call. The
# server is the binary bot-api-binary.yml builds from a pinned
# tdlib/telegram-bot-api commit and attaches to a release of this
# repository; it is taken by the checksum recorded below, because it is
# handed the bot token and the files. Needs an ubuntu-24.04 runner, the
# system the binary is built on; a macOS or Windows build hands its files
# over as an artifact to a job that runs this.

name: Publish to a Telegram channel.
description: Post the files of a directory to a Telegram channel through a local Bot API server.

inputs:
  bot-token:
    description: Token of a bot that may post in the channel.
    required: true
  api-id:
    description: Telegram API id the Bot API server runs with.
    required: true
  api-hash:
    description: Telegram API hash the Bot API server runs with.
    required: true
  chat-id:
    description: The channel, its id or @username.
    required: true
  copy-to:
    description: Other channels that get a copy of the post, separated by spaces or lines; the files are not sent again.
  directory:
    description: Directory whose files are posted, in the order of their names.
    required: true
  title:
    description: Name of the application, the first words of the caption.
  version:
    description: Version shown after the title.
  hashtags:
    description: Hashtags of the caption, without '#', separated by spaces.
  body-file:
    description: Plain text placed under the title; its last lines are dropped when it does not fit.
  links:
    description: Links that close the caption, one TEXT=ADDRESS per line.
  caption-file:
    description: A ready HTML caption, used instead of title, version, hashtags, body and links.

outputs:
  messages:
    description: 'The posted messages as JSON, [{"file": <name>, "message_id": <id>}].'
    value: ${{ steps.publish.outputs.messages }}

runs:
  using: composite
  steps:
    - name: Publish.
      id: publish
      shell: bash
      env:
        # The release of this repository that holds the server and the
        # SHA-256 of the binary; bot-api-binary.yml prints both.
        BOT_API_RELEASE: ""
        BOT_API_SHA256: ""
        CHANNEL_BOT_TOKEN: ${{ inputs.bot-token }}
        TELEGRAM_API_ID: ${{ inputs.api-id }}
        TELEGRAM_API_HASH: ${{ inputs.api-hash }}
        CHAT_ID: ${{ inputs.chat-id }}
        COPY_TO: ${{ inputs.copy-to }}
        DIRECTORY: ${{ inputs.directory }}
        TITLE: ${{ inputs.title }}
        VERSION: ${{ inputs.version }}
        HASHTAGS: ${{ inputs.hashtags }}
        BODY_FILE: ${{ inputs.body-file }}
        LINKS: ${{ inputs.links }}
        CAPTION_FILE: ${{ inputs.caption-file }}
      run: |
        set -euo pipefail
        if [ -z "$BOT_API_RELEASE" ] || [ -z "$BOT_API_SHA256" ]; then
          echo "::error::This commit of the action records no Bot API server binary."
          exit 1
        fi

        files=()
        while IFS= read -r -d '' file; do
          files+=("$file")
        done < <(find "$(realpath "$DIRECTORY")" -maxdepth 1 -type f -print0 | sort -z)
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::$DIRECTORY has no files to post."
          exit 1
        fi

        arguments=(--chat-id "$CHAT_ID" --out "$RUNNER_TEMP/channel-messages.json")
        for chat in $COPY_TO; do
          arguments+=(--copy-to "$chat")
        done
        if [ -n "$CAPTION_FILE" ]; then
          arguments+=(--caption-file "$CAPTION_FILE")
        else
          arguments+=(--title "$TITLE" --version "$VERSION")
          for tag in $HASHTAGS; do
            arguments+=(--hashtag "$tag")
          done
          if [ -n "$BODY_FILE" ]; then
            arguments+=(--body-file "$BODY_FILE")
          fi
          while IFS= read -r link; do
            if [ -n "$link" ]; then
              arguments+=(--link "$link")
            fi
          done <<< "$LINKS"
        fi

        work="$(mktemp -d "$RUNNER_TEMP/bot-api.XXXXXX")"
        server=""
        finish() {
          status=$?
          if [ -n "$server" ]; then
            kill "$server" 2> /dev/null || true
            wait "$server" 2> /dev/null || true
          fi
          if [ "$status" -ne 0 ] && [ -f "$work/log" ]; then
            tail -n 50 "$work/log"
          fi
          # The working directory of the server holds the session of the bot.
          rm -rf "$work"
        }
        trap finish EXIT

        curl --fail --silent --show-error --location --retry 3 \
          --output "$work/telegram-bot-api" \
          "https://github.com/NextAlone/NagramActionRelated/releases/download/$BOT_API_RELEASE/telegram-bot-api-linux-x86_64"
        echo "$BOT_API_SHA256  $work/telegram-bot-api" | sha256sum --check --quiet
        chmod +x "$work/telegram-bot-api"

        port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
        mkdir "$work/data" "$work/temp"
        # The server reads the API id and hash from the environment.
        "$work/telegram-bot-api" --local \
          --http-ip-address=127.0.0.1 --http-port="$port" \
          --dir="$work/data" --temp-dir="$work/temp" --log="$work/log" &
        server=$!

        python3 "$GITHUB_ACTION_PATH/channel_publish.py" \
          --api "http://127.0.0.1:$port" "${arguments[@]}" "${files[@]}"
        echo "messages=$(cat "$RUNNER_TEMP/channel-messages.json")" >> "$GITHUB_OUTPUT"
