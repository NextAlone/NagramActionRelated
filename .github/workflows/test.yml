name: Tests.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:

  tests:
    name: Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Clone.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Action tests.
        run: python3 channel-publish/test_channel_publish.py
